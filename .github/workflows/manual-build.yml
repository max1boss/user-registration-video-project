name: 🎯 Manual APK Build (Simple)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '📋 Версия приложения'
        required: true
        default: '1.0.0'
        type: string

jobs:
  manual-build:
    name: 🚀 Manual Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🚀 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: 📝 Create minimal project structure
      run: |
        # Создаем базовый package.json
        cat > package.json << 'EOF'
        {
          "name": "user-registration-video",
          "version": "1.0.0",
          "scripts": {
            "build": "mkdir -p dist && echo '<html><head><title>User Registration Video</title></head><body><h1>User Registration Video App v${{ inputs.version }}</h1><p>Добро пожаловать в приложение регистрации!</p></body></html>' > dist/index.html"
          }
        }
        EOF
        
        # Создаем capacitor.config.json
        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.userregistration.video",
          "appName": "User Registration Video",
          "webDir": "dist"
        }
        EOF

    - name: 📦 Install Capacitor only
      run: |
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

    - name: 🏗️ Build web app
      run: npm run build

    - name: 📱 Add Android platform
      run: npx cap add android

    - name: 🔄 Sync Capacitor
      run: npx cap sync android

    - name: 🔨 Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 📂 Find and prepare APK
      run: |
        APK_FILE=$(find android -name "*.apk" -type f | head -1)
        FINAL_NAME="user-registration-video-v${{ inputs.version }}.apk"
        cp "$APK_FILE" "$FINAL_NAME"
        echo "APK_PATH=$FINAL_NAME" >> $GITHUB_ENV
        ls -la "$FINAL_NAME"

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: user-registration-video-v${{ inputs.version }}
        path: ${{ env.APK_PATH }}
        retention-days: 30
