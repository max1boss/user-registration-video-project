name: 🚀 Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🚀 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: '34'
        build-tools: '34.0.0'

    - name: 📦 Install dependencies
      run: |
        npm ci
        npm install -g @capacitor/cli

    - name: 🏗️ Build React app
      run: npm run build

    - name: 🔧 Initialize Capacitor Android
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: 🔨 Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: 📂 Locate APK files
      id: locate_apk
      run: |
        APK_PATH=$(find android -name "*.apk" -type f | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ No APK files found"
          exit 1
        fi
        
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        FINAL_NAME="user-registration-video-latest.apk"
        cp "$APK_PATH" "$FINAL_NAME"
        
        echo "apk_path=$FINAL_NAME" >> $GITHUB_OUTPUT
        echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

    - name: 📤 Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: user-registration-video-latest
        path: ${{ steps.locate_apk.outputs.apk_path }}
        retention-days: 30
